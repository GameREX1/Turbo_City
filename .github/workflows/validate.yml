name: Turbo City validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  browser-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --input-type=module --check < game.js
          find src -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done
          node --input-type=module --check < workers/tokyo-map-proxy.js

      - name: Install browser test runner
        run: npm install --no-save --package-lock=false playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test Tokyo asset proxy
        run: node tests/worker-proxy.mjs

      - name: Test Tokyo road spawn selection
        run: node tests/tokyo-spawn.mjs

      - name: Start local web server
        run: |
          python3 -m http.server 4173 > /tmp/turbo-city-http.log 2>&1 &
          echo $! > /tmp/turbo-city-http.pid

      - name: Run gameplay smoke tests
        run: node tests/smoke.mjs
